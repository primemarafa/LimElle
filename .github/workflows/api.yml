name: Lim'Elle API

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: limelle
          POSTGRES_PASSWORD: limelle
          POSTGRES_DB: limelle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limelle -d limelle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://limelle:limelle@localhost:5432/limelle_test
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify PostgreSQL connection
        run: node --input-type=module -e "import('./server/db/client.js').then(async ({ getDb, closeDb }) => { const db = await getDb(); const result = await db.query('SELECT 1 AS connected'); if (result.rows[0].connected !== 1) process.exit(1); await closeDb(); })"

      - name: Test API
        run: npm run test:server

      - name: Build frontend
        run: npm run build
