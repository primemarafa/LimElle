name: Lim'Elle API

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test API
        run: npm run test:server

      - name: Build frontend
        run: npm run build
