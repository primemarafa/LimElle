name: Lim'Elle Docker

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate lockfile
        run: npm ci
      - name: Build API image
        run: docker build --pull -t limelle-api:test .
      - name: Inspect image
        run: docker image inspect limelle-api:test
